name: EOD sales emails

# Sends the Mouldshop and Nickerson end-of-day sales emails.
# Mon–Thu at 17:05 UK time, Friday at 16:05 UK time.
#
# GitHub cron runs in UTC, so each slot is scheduled at both its BST and GMT
# equivalents and the "Check UK time" step lets only the right one through.
# That keeps the send time correct across the clock changes.
#
# Credentials come from repository secrets (Settings → Secrets and variables
# → Actions): BC_TENANT, BC_CLIENT_ID, BC_CLIENT_SECRET.

on:
  schedule:
    - cron: '5 16,17 * * 1-4' # Mon–Thu 17:05 UK (16:05 UTC in BST, 17:05 UTC in GMT)
    - cron: '5 15,16 * * 5'   # Fri 16:05 UK (15:05 UTC in BST, 16:05 UTC in GMT)
  workflow_dispatch:
    inputs:
      which:
        description: 'Which email to send'
        type: choice
        options: [both, mouldshop, nickerson]
        default: both

concurrency:
  group: eod-sales-emails
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check UK time
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          dow=$(TZ=Europe/London date +%u)   # 1=Mon … 7=Sun
          hour=$(TZ=Europe/London date +%H)
          if [ "$dow" -le 4 ]; then target=17; else target=16; fi
          if [ "$hour" = "$target" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "UK hour is $hour, sends at $target:05 today — skipping this slot."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.gate.outputs.go == 'true'
        run: npm install --no-audit --no-fund

      - name: Mouldshop EOD email
        if: steps.gate.outputs.go == 'true' && (github.event_name == 'schedule' || inputs.which != 'nickerson')
        env:
          BC_TENANT: ${{ secrets.BC_TENANT }}
          BC_CLIENT_ID: ${{ secrets.BC_CLIENT_ID }}
          BC_CLIENT_SECRET: ${{ secrets.BC_CLIENT_SECRET }}
        run: node mouldshop-eod-email.js

      - name: Nickerson EOD email
        if: always() && steps.gate.outputs.go == 'true' && (github.event_name == 'schedule' || inputs.which != 'mouldshop')
        env:
          BC_TENANT: ${{ secrets.BC_TENANT }}
          BC_CLIENT_ID: ${{ secrets.BC_CLIENT_ID }}
          BC_CLIENT_SECRET: ${{ secrets.BC_CLIENT_SECRET }}
        run: node nickerson-eod-email.js
